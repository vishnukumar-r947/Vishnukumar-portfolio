<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="480" rx="28" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="180" r="140" fill="url(#glowGrad)" />

  <!-- Futuristic Cyber Grid lines in avatar background -->
  <g opacity="0.12" stroke="#00d2ff" stroke-width="1">
    <line x1="40" y1="80" x2="360" y2="80" />
    <line x1="40" y1="160" x2="360" y2="160" />
    <line x1="40" y1="240" x2="360" y2="240" />
    <line x1="40" y1="320" x2="360" y2="320" />
    <line x1="40" y1="400" x2="360" y2="400" />
    <line x1="100" y1="40" x2="100" y2="440" />
    <line x1="200" y1="40" x2="200" y2="440" />
    <line x1="300" y1="40" x2="300" y2="440" />
  </g>

  <!-- Floating Rings -->
  <circle cx="200" cy="190" r="105" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6" stroke-dasharray="8 6" />
  <circle cx="200" cy="190" r="125" fill="none" stroke="#00d2ff" stroke-width="1.5" opacity="0.3" />

  <!-- Stylized Modern Developer Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="155" r="54" fill="url(#accentGrad)" />
  <circle cx="200" cy="155" r="52" fill="#0f172a" />
  <circle cx="200" cy="155" r="46" fill="url(#glassGrad)" />

  <!-- Developer Monogram "VR" -->
  <text x="200" y="167" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">VR</text>

  <!-- Torso & Shoulders -->
  <path d="M 100 370 C 100 270, 140 240, 200 240 C 260 240, 300 270, 300 370 Z" fill="url(#glassGrad)" stroke="url(#accentGrad)" stroke-width="2" />
  <path d="M 125 370 C 125 295, 155 268, 200 268 C 245 268, 275 295, 275 370 Z" fill="#0f172a" opacity="0.75" />

  <!-- Code brackets graphic -->
  <path d="M 170 305 L 155 320 L 170 335" fill="none" stroke="#00d2ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 230 305 L 245 320 L 230 335" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="208" y1="305" x2="192" y2="335" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

  <!-- Interactive/Upload Badge at bottom -->
  <g transform="translate(60, 395)">
    <rect width="280" height="42" rx="21" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <circle cx="28" cy="21" r="5" fill="#10b981" />
    <text x="42" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">Vishnukumar R • Profile</text>
  </g>

  <!-- Border Highlight -->
  <rect x="2" y="2" width="396" height="476" rx="26" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6" />
</svg>
